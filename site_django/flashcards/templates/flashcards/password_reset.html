{% extends "flashcards/base.html" %}
{% block title %}Recuperar senha · Caderno de Idiomas{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-mark">Caderno de <em>Idiomas</em></div>
    <h1>Esqueceu a senha?</h1>
    <p class="lede">Digite seu e-mail — mandamos um link pra você escolher uma nova.</p>
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <div class="k">E-mail</div>
        <input type="email" name="email" autofocus autocomplete="email" required>
      </div>
      <button class="btn primary" type="submit" style="width:100%">Enviar link</button>
    </form>
    <p class="auth-switch"><a href="{% url 'login' %}">Voltar pro login</a></p>
  </div>
</div>
{% endblock %}
